name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo xtask build
      - run: readelf -W --version-info target/runtime/Artitux.so
      - name: Component lint configurations
        run: |
          for profile in dev release; do
            for features in '' cpuid hooks syscall kuser artifact faketime gamescope debug environment cpuid,hooks,syscall cpuid,hooks,syscall,kuser cpuid,hooks,syscall,kuser,faketime,gamescope; do
              cargo clippy -p artitux-runtime --lib --profile "$profile" --no-default-features --features "$features" -- -D warnings
            done
          done
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri
      # Artifact code relies on raw syscalls, mmap, signals and fork, which Miri
      # cannot emulate; Miri covers the non-Artifact feature set plus protocol.
      - run: cargo +nightly miri test -p artitux-runtime --lib --no-default-features --features cpuid,hooks,syscall,kuser,faketime,gamescope,debug,environment
      - run: cargo +nightly miri test -p artitux-rust
  kmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure kernel headers
        run: |
          if [ ! -d "/lib/modules/$(uname -r)/build" ]; then
            sudo apt-get update
            sudo apt-get install -y "linux-headers-$(uname -r)"
          fi
      - name: Build artitux_kmod, CLI, and VM test binaries
        run: |
          make -C kmod all
          make -C kmod cli
          gcc -O2 -Wall -Wextra -pthread kmod/tests/vm_test.c -o /tmp/vm_test
          gcc -m32 -nostdlib -static -fno-pie -no-pie -ffreestanding \
            -fno-stack-protector -fno-asynchronous-unwind-tables \
            -O2 -Wall -Wextra kmod/tests/ia32_sig_test.c -o /tmp/ia32_sig_test
