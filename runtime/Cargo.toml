[package]
name = "artitux-runtime"
version = "1.1.2"
edition = "2024"
rust-version.workspace = true
description = "Linux x86_64 preload runtime for Artitux"
license-file = "../LICENSE"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["cpuid", "hooks", "syscall", "kuser", "faketime", "gamescope", "debug", "environment", "artifact"]
cpuid = []
hooks = []
syscall = []
kuser = []
artifact = ["cpuid", "hooks", "syscall", "kuser", "environment"]
faketime = []
gamescope = []
debug = []
environment = []

[dependencies]
artitux = { package = "artitux-rust", path = ".." }
libc = "0.2"

[lints]
workspace = true
