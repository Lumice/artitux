[package]
name = "artitux-runtime"
version = "1.0.4"
edition = "2024"
rust-version.workspace = true
description = "Linux x86_64 runtime for the Artitux Rust migration"
license-file = "../LICENSE"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["cpuid", "hooks", "reflex", "syscall", "kuser", "faketime", "gamescope", "debug", "environment", "artifact"]
cpuid = []
hooks = []
reflex = []
syscall = []
kuser = []
artifact = ["cpuid", "hooks", "reflex", "syscall", "kuser", "environment"]
faketime = ["kuser"]
gamescope = []
debug = []
environment = []

[dependencies]
artitux = { package = "artitux-rust", path = ".." }
libc = "0.2"

[lints]
workspace = true
